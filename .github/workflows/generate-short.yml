name: Generate YouTube Short


on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for the YouTube Short"
        required: true
        type: string
      gemini_model:
        description: "Gemini model"
        required: false
        default: "gemini-3.8-flash"
        type: string


permissions:
  contents: read


jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_MODEL: ${{ inputs.gemini_model }}
      OUTPUT_DIR: output
      TEMP_DIR: .tmp
      VIDEO_WIDTH: 1080
      VIDEO_HEIGHT: 1920
      VIDEO_FPS: 30
      MAX_SCENES: 8
      VOICE: en-US-AriaNeural
      LOG_LEVEL: INFO
      FFMPEG_BINARY: ffmpeg
    steps:
